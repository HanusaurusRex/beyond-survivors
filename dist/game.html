<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
/* Beyond Survivors - dark Castlevania-ish UI */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Courier New", monospace; color: #e8dcc0; user-select: none; }
#wrap { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: center center; background: #000; image-rendering: pixelated; }
#game { position: absolute; inset: 0; width: 1280px; height: 720px; image-rendering: pixelated; cursor: crosshair; }
#ui { position: absolute; inset: 0; overflow-y: auto; display: none; }
#overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(5, 0, 12, 0.72); z-index: 5; }
button { font-family: inherit; font-weight: bold; font-size: 15px; color: #f0e6c8; background: linear-gradient(#3a1830, #200a1c); border: 3px solid #a07840; box-shadow: inset 0 0 0 2px #140810, 0 3px 0 #000; padding: 8px 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
button:hover:not([disabled]) { background: linear-gradient(#5a2448, #300e28); border-color: #ffd070; color: #fff; }
button[disabled] { opacity: 0.4; cursor: not-allowed; }
button.big { font-size: 22px; width: 380px; padding: 12px; margin: 6px 0; }
button.sm { font-size: 12px; padding: 4px 9px; border-width: 2px; }
button.ghost { background: #160a14; }
button.go { background: linear-gradient(#2a5a1a, #143010); border-color: #c0e060; }
button.danger { border-color: #c02020; }
.menu-screen { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.title { text-align: center; margin-bottom: 26px; }
.title .t1, .title .t2 { font-size: 92px; font-weight: bold; line-height: 0.95; letter-spacing: 8px; color: #e8c060; text-shadow: 4px 4px 0 #6a0a1a, 8px 8px 0 #000; }
.title .t2 { color: #d8d0c0; font-size: 70px; }
.title .sub { margin-top: 12px; color: #c05070; font-size: 20px; letter-spacing: 3px; text-shadow: 2px 2px 0 #000; }
.menu-buttons { display: flex; flex-direction: column; align-items: center; }
.goldbar { position: absolute; top: 14px; right: 18px; color: #ffd040; font-size: 18px; text-shadow: 2px 2px 0 #000; background: rgba(0,0,0,0.5); padding: 4px 10px; border: 2px solid #6a5020; }
.foot { position: absolute; bottom: 14px; color: #a08890; font-size: 13px; }
.screen { position: relative; padding: 16px 28px 30px; background: rgba(10, 4, 16, 0.86); min-height: 100%; }
h1 { text-align: center; color: #e8c060; font-size: 38px; margin: 4px 0 12px; letter-spacing: 4px; text-shadow: 3px 3px 0 #6a0a1a; }
h2 { color: #d8a050; font-size: 20px; margin: 14px 0 8px; letter-spacing: 2px; }
h3 { color: #d8a050; margin: 8px 0 6px; font-size: 16px; }
.dim { color: #9a8a90; font-size: 13px; }
.center { text-align: center; }
.gold { color: #ffd040; } .red { color: #ff4040 !important; }
.row { display: flex; gap: 12px; justify-content: center; margin-top: 16px; align-items: center; }
.row.small { justify-content: flex-start; margin-top: 8px; }
.chars { display: flex; gap: 12px; justify-content: center; }
.card.char { width: 220px; background: #160a18; border: 3px solid #4a3040; padding: 10px; text-align: center; cursor: pointer; }
.card.char:hover { border-color: var(--cc); }
.card.char.sel { border-color: var(--cc); box-shadow: 0 0 18px var(--cc); background: #24102a; }
.portrait { image-rendering: pixelated; height: 120px; }
.portrait.big { height: 170px; }
.cname { font-size: 22px; font-weight: bold; color: #fff; }
.ctitle { color: #c0a080; font-size: 13px; }
.clvl { color: #ffd040; font-size: 13px; margin: 4px 0; }
.cstats { font-size: 12px; color: #c8c0d0; }
.cweap, .cspec { font-size: 12px; color: #a0c0ff; margin-top: 3px; }
.cdesc { margin: 10px auto 0; max-width: 1100px; text-align: center; font-size: 14px; }
.maps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
button.map { text-transform: none; text-align: left; padding: 8px; letter-spacing: 0; }
button.map.sel { border-color: #ffd070; box-shadow: 0 0 12px #ffd070; }
.mname { font-size: 14px; color: #ffd070; } .mdesc { font-size: 11px; font-weight: normal; color: #c0b0b0; margin: 4px 0; min-height: 28px; } .mmult { font-size: 11px; color: #ff9070; }
.tabs { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
.tab.sel { border-color: var(--cc); box-shadow: 0 0 10px var(--cc); }
.upgrade { display: grid; grid-template-columns: 300px 1fr 380px; gap: 16px; }
.col { background: #140a16; border: 2px solid #3a2838; padding: 10px; }
.col.left { text-align: center; }
.lvl { font-size: 18px; color: #ffd040; margin-top: 6px; }
.bar { height: 10px; background: #2a1a2a; border: 1px solid #6a5040; margin: 4px 0; } .bar div { height: 100%; background: #4a7aff; }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: 12px; margin: 8px 0; text-align: left; }
.statgrid div { display: flex; justify-content: space-between; border-bottom: 1px dotted #3a2838; } .statgrid b { color: #fff; }
.talent { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
.tname { width: 170px; } .tval { width: 46px; text-align: right; color: #80ff80; }
.pips { display: flex; gap: 2px; } .pips i { width: 12px; height: 12px; background: #2a1a2a; border: 1px solid #5a4050; display: block; } .pips i.on { background: #ffd040; border-color: #fff0a0; }
.pts { color: #ffd040; font-size: 14px; margin-left: 10px; }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.slot { border: 2px dashed #3a2838; padding: 5px 7px; min-height: 52px; font-size: 11px; }
.slot.filled { border-style: solid; cursor: pointer; background: #1c0e1e; } .slot.filled:hover { border-color: #ff6060; }
.sname { color: #8a7a90; font-size: 10px; text-transform: uppercase; }
.slot .iname { font-size: 12px; font-weight: bold; } .slot .imods { color: #80d080; }
.r-common { border-color: #c8c8c8 !important; } .r-uncommon { border-color: #5cdb5c !important; } .r-rare { border-color: #4fa3ff !important; } .r-epic { border-color: #c060ff !important; } .r-legendary { border-color: #ff9a20 !important; } .r-set { border-color: #30ffd0 !important; }
.inv { max-height: 260px; overflow-y: auto; }
.item { border: 2px solid #3a2838; background: #1a0c1a; padding: 7px; margin-bottom: 6px; font-size: 12px; }
.item .iname { font-weight: bold; font-size: 13px; } .itype { color: #9a8a90; font-size: 11px; }
.imods span { display: inline-block; color: #80e080; margin-right: 8px; }
.iact { margin-top: 5px; display: flex; gap: 6px; align-items: center; }
.sold { color: #ff6060; font-weight: bold; }
.setbox { margin-top: 10px; border: 2px solid #30ffd0; padding: 8px; font-size: 12px; background: #0c1a1a; }
.setname { color: #30ffd0; font-weight: bold; font-size: 14px; }
.piece { display: inline-block; margin: 3px 4px 0 0; padding: 1px 4px; border: 1px solid #2a4a4a; color: #6a8a8a; font-size: 11px; } .piece.own { color: #30ffd0; border-color: #30ffd0; }
.bonus { color: #6a8a8a; margin-top: 3px; } .bonus.on { color: #30ffd0; font-weight: bold; }
.market { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 1150px; margin: 10px auto; }
.market .item { padding: 12px; min-height: 120px; }
.talentbuy { border-color: #ffd040 !important; }
.options { max-width: 720px; margin: 0 auto; }
.opt { display: flex; align-items: center; gap: 14px; margin: 8px 0; } .opt label { width: 240px; } .opt input[type=range] { width: 260px; accent-color: #d8a050; }
button.key { min-width: 140px; } button.key.wait { border-color: #ffd040; color: #ffd040; }
.modal { background: #12081a; border: 4px solid #a07840; box-shadow: 0 0 0 4px #000, 0 0 40px #000; padding: 20px 28px; max-width: 1180px; max-height: 690px; overflow-y: auto; }
.modal .screen { background: none; min-height: 0; padding: 0; }
.levelup { text-align: center; }
.levelup h1 { color: #80c0ff; }
.lu-cards { display: flex; gap: 14px; justify-content: center; margin: 16px 0; }
.lu-card { width: 250px; background: #1c0e22; border: 3px solid #e05080; padding: 12px; cursor: pointer; position: relative; text-align: center; }
.lu-card:hover { transform: translateY(-4px); box-shadow: 0 0 16px #e05080; }
.lu-card.secondary { border-color: #4fa3ff; } .lu-card.secondary:hover { box-shadow: 0 0 16px #4fa3ff; }
.lu-card.evo { border-color: #ffd040; background: #2a1a08; box-shadow: 0 0 20px #ffd040; } .lu-card.bonus { border-color: #80ff80; }
.lu-card.taken { opacity: 0.3; pointer-events: none; }
.lu-card img { width: 56px; height: 56px; image-rendering: pixelated; }
.lu-key { position: absolute; top: 4px; left: 8px; color: #806070; font-weight: bold; }
.lu-tag { font-size: 11px; color: #ffd040; margin: 4px 0; } .lu-name { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 6px; } .lu-desc { font-size: 12px; color: #c8c0d0; }
.pause { text-align: center; min-width: 520px; }
.pabil { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0; max-width: 700px; }
.pa { display: flex; align-items: center; gap: 4px; font-size: 11px; background: #1c0e22; padding: 2px 6px 2px 2px; } .pa img { width: 24px; height: 24px; }
.results .rgrid { max-width: 560px; margin: 16px auto; }
.rr { display: flex; justify-content: space-between; font-size: 18px; padding: 5px 0; border-bottom: 1px dotted #4a3040; } .rr b { color: #ffd040; }
.unlock { text-align: center; color: #30ffd0; font-size: 22px; font-weight: bold; margin: 10px; text-shadow: 0 0 10px #30ffd0; }
.codex { max-width: 900px; } .cx { display: flex; gap: 10px; margin: 8px 0; font-size: 13px; } .cx img { width: 40px; height: 40px; } .evo { color: #e0c080; margin-top: 3px; }
.debug { position: absolute; bottom: 6px; left: 8px; color: #ff60ff; font-size: 12px; display: flex; gap: 4px; align-items: center; z-index: 3; }
.debug button { font-size: 10px; padding: 2px 6px; border-color: #ff60ff; }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: #5a3a4a; } ::-webkit-scrollbar-track { background: #12081a; }

/* ---------- v2: Gear & Inventory (paper doll), tooltips, buy flow, supers ---------- */
.subtabs { display: flex; gap: 10px; justify-content: center; margin: 4px 0 12px; }
.subtab { font-size: 16px; padding: 10px 22px; border-width: 3px; }
.subtab.sel { border-color: #ffd040; background: #3a2410; color: #ffe080; box-shadow: 0 0 14px #ffd04088; }
.subtab small { color: #b0a0a0; font-size: 11px; }
.gear { display: grid; grid-template-columns: 520px 1fr 250px; gap: 14px; }
.doll { display: grid; grid-template-columns: 180px 1fr 180px; gap: 8px; background: radial-gradient(circle at 50% 40%, #2a1430, #12081a 70%); border: 2px solid #4a3040; padding: 10px; }
.dcol { display: flex; flex-direction: column; gap: 8px; }
.dcenter { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.dcenter .portrait.big { width: 120px; }
.dcenter .hint { font-size: 11px; margin-top: 10px; line-height: 1.5; }
.pslot { position: relative; display: flex; align-items: center; gap: 6px; border: 2px dashed #3a2838; background: #140a18; padding: 4px 6px; min-height: 52px; }
.pslot img { width: 40px; height: 30px; image-rendering: pixelated; object-fit: contain; flex: none; }
.pslot.filled { border: 2px solid var(--rc); cursor: pointer; background: #1e0e22; box-shadow: inset 0 0 10px #0008, 0 0 6px var(--rc); }
.pslot.filled:hover { background: #2e1020; border-color: #ff6060; }
.pslot.hl { border-color: #80ff80; box-shadow: 0 0 10px #80ff80; }
.ps-slot { font-size: 10px; color: #9a8a90; text-transform: uppercase; letter-spacing: 1px; }
.ps-name { font-size: 11px; font-weight: bold; line-height: 1.15; max-height: 26px; overflow: hidden; }
.xbtn { position: absolute; top: 2px; right: 2px; padding: 0 5px; font-size: 11px; line-height: 16px; min-width: 0; background: #3a0a10; border: 1px solid #a03040; }
.bagcol h3, .sumcol h3 { margin-top: 0; }
.bag { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
.bagitem { border: 2px solid var(--rc); background: #1a0c1a; padding: 6px; cursor: pointer; display: grid; grid-template-columns: 44px 1fr; grid-template-rows: auto auto auto; column-gap: 6px; }
.bagitem:hover { background: #2a1430; box-shadow: 0 0 10px var(--rc); }
.bagitem.locked { opacity: 0.55; cursor: default; }
.bagitem img { grid-row: 1 / 3; width: 44px; height: 32px; image-rendering: pixelated; object-fit: contain; }
.bi-name { font-weight: bold; font-size: 12px; line-height: 1.15; } .bi-type { font-size: 10px; color: #9a8a90; }
.bi-act { grid-column: 1 / 3; display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.bi-act .sm { font-size: 10px; padding: 2px 6px; }
.emptybag { grid-column: 1 / 3; padding: 20px; text-align: center; }
.tip { display: none; position: absolute; z-index: 500; width: 280px; background: #0c0610; border: 3px solid #c0a060; box-shadow: 0 0 0 2px #000, 0 6px 20px #000; padding: 10px; font-size: 12px; pointer-events: none; }
.tip-name { font-weight: bold; font-size: 14px; }
.tip .imods span, .item .imods span { display: block; color: #80d080; }
.cmp { margin-top: 6px; border-top: 1px solid #3a2838; padding-top: 5px; font-size: 12px; }
.cmp span { display: block; }
.up { color: #60ff60; } .down { color: #ff6060; }
.ihead { display: flex; gap: 8px; align-items: center; }
.iicon { width: 40px; height: 30px; image-rendering: pixelated; object-fit: contain; }
.modal.buy { width: 620px; text-align: left; }
.modal.buy .item { margin: 10px 0; }
.whos { display: flex; gap: 8px; justify-content: center; margin: 12px 0; }
.who { display: flex; flex-direction: column; align-items: center; padding: 8px 10px; min-width: 96px; }
.who img { width: 54px; image-rendering: pixelated; }
.who.sel { border-color: var(--cc); box-shadow: 0 0 12px var(--cc); }
.who small { color: #ff6060; font-size: 10px; }
.lu-card.super { border-color: #ff40ff; background: linear-gradient(160deg, #3a0a40, #1a0a30); box-shadow: 0 0 24px #ff40ff, inset 0 0 20px #ff40ff44; animation: superpulse 1s infinite alternate; }
@keyframes superpulse { from { box-shadow: 0 0 14px #ff40ff; } to { box-shadow: 0 0 30px #ffd040; } }
.pink { color: #ff70ff; }

.gear .portrait.big { width: 96px; }
.gear .setbox { font-size: 11px; padding: 6px; margin-top: 6px; }
.gear .bag { max-height: 250px; }
.gear .pslot { min-height: 46px; }

/* ---------- v3: mobile / touch ---------- */
html, body { overscroll-behavior: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body.touch { touch-action: none; position: fixed; inset: 0; }
#game { touch-action: none; }
#ui, .modal, .bag, .inv { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
body.touch #ui, body.touch .modal, body.touch .bag, body.touch .inv { touch-action: pan-y; }
body.touch button, body.touch [data-a] { touch-action: manipulation; }
body.touch input[type=range] { touch-action: none; height: 30px; }
img { -webkit-user-drag: none; -webkit-touch-callout: none; }
#safeProbe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

/* touch: bigger hit targets, no sticky hover effects, safe areas */
body.touch button { min-height: 50px; }
body.touch button.sm { min-height: 44px; font-size: 13px; padding: 6px 12px; }
body.touch .bi-act .sm { font-size: 12px; padding: 6px 10px; min-height: 44px; }
body.touch .xbtn { min-height: 0; min-width: 40px; height: 40px; padding: 0; font-size: 16px; line-height: 36px; top: 4px; right: 4px; }
body.touch .pslot { min-height: 56px; padding-right: 46px; }
body.touch .bi-act .info { min-width: 40px; }
body.touch .lu-card:hover { transform: none; }
body.touch .screen { padding: calc(10px + var(--sat, 0px)) calc(14px + var(--sar, 0px)) calc(26px + var(--sab, 0px)) calc(14px + var(--sal, 0px)); }
body.touch .menu-screen { padding: var(--sat, 0px) var(--sar, 0px) var(--sab, 0px) var(--sal, 0px); min-height: 100%; height: auto; }
body.touch .goldbar { top: calc(10px + var(--sat, 0px)); right: calc(14px + var(--sar, 0px)); }
body.touch .foot { bottom: calc(8px + var(--sab, 0px)); left: 10px; right: 10px; text-align: center; font-size: 11px; }
body.touch #overlay { padding: var(--sat, 0px) var(--sar, 0px) var(--sab, 0px) var(--sal, 0px); }
body.touch .modal { max-width: calc(100% - 16px); max-height: calc(100% - 16px); }
body.touch .tip { width: min(300px, calc(100% - 16px)); }
body.touch .opt input[type=range] { flex: 1; min-width: 120px; }
body.touch .row { flex-wrap: wrap; }
body.touch .tabs, body.touch .subtabs { flex-wrap: wrap; }

/* compact (tablets, phone landscape: logical width < 1100) */
body.compact .chars { flex-wrap: wrap; }
body.compact .card.char { width: 170px; padding: 8px; }
body.compact .card.char .portrait { height: 84px; }
body.compact .maps { grid-template-columns: repeat(3, 1fr); }
body.compact .market { grid-template-columns: repeat(2, 1fr); }
body.compact .upgrade { grid-template-columns: 240px 1fr; }
body.compact .upgrade .col.right { grid-column: 1 / -1; }
body.compact .gear { grid-template-columns: 1fr 1fr; }
body.compact .gear .doll { grid-column: 1 / -1; grid-template-columns: 1fr 150px 1fr; }
body.compact .gear .bag { max-height: none; }
body.compact .lu-cards { flex-wrap: wrap; }
body.compact .lu-card { width: 200px; }
body.compact .pause { min-width: 0; }

/* short (phone landscape: logical height < 560) */
body.short .title { margin-bottom: 8px; }
body.short .title .t1 { font-size: 52px; letter-spacing: 5px; }
body.short .title .t2 { font-size: 40px; }
body.short .title .sub { font-size: 14px; margin-top: 6px; }
body.short button.big { font-size: 17px; padding: 8px; margin: 3px 0; width: 340px; }
body.short h1 { font-size: 26px; margin: 2px 0 8px; }
body.short .modal { padding: 10px 14px; }
body.short .lu-cards { margin: 8px 0; gap: 8px; }
body.short .lu-card { padding: 8px; }
body.short .lu-card img { width: 40px; height: 40px; }
body.short .pabil { margin: 6px 0; }
body.short.touch .foot { display: none; }
body.short.touch button.sm, body.short.touch .bi-act .sm { min-height: 48px; }
body.short.touch button { min-height: 52px; }

/* narrow (portrait phones: logical width < 800) */
body.narrow .title .t1 { font-size: 58px; letter-spacing: 4px; }
body.narrow .title .t2 { font-size: 44px; letter-spacing: 4px; }
body.narrow .title .sub { font-size: 15px; }
body.narrow button.big { width: min(360px, 88vw); width: 88%; max-width: 360px; }
body.narrow .menu-buttons { width: 100%; }
body.narrow h1 { font-size: 26px; letter-spacing: 2px; }
body.narrow .screen > .goldbar { position: static; display: table; margin: 0 auto 6px; font-size: 15px; }
body.narrow .chars { flex-wrap: wrap; gap: 8px; }
body.narrow .card.char { width: calc(50% - 6px); padding: 6px; }
body.narrow .card.char .portrait { height: 70px; }
body.narrow .cname { font-size: 18px; }
body.narrow .maps { grid-template-columns: 1fr 1fr; }
body.narrow .market { grid-template-columns: 1fr; }
body.narrow .upgrade, body.narrow .gear { grid-template-columns: 1fr; }
body.narrow .upgrade .col.right, body.narrow .gear .doll { grid-column: auto; }
body.narrow .gear .doll { grid-template-columns: 1fr 1fr; grid-template-areas: "c c" "l r"; }
body.narrow .doll .dcenter { grid-area: c; flex-direction: row; gap: 10px; justify-content: flex-start; text-align: left; }
body.narrow .doll .dcenter .portrait.big { width: 64px; height: auto; }
body.narrow .doll .dcol:first-child { grid-area: l; } body.narrow .doll .dcol:last-child { grid-area: r; }
body.narrow .dcenter .hint { margin-top: 0; }
body.narrow .bag { grid-template-columns: 1fr; }
body.narrow .tname { width: 120px; } body.narrow .talent { flex-wrap: wrap; }
body.narrow .pips i { width: 10px; height: 10px; }
body.narrow .lu-cards { flex-direction: column; align-items: stretch; gap: 8px; }
body.narrow .lu-card { width: auto; display: grid; grid-template-columns: 52px 1fr; column-gap: 10px; text-align: left; padding: 8px 10px 8px 26px; align-items: center; }

'use strict';
window.DS = window.DS || {};
(function (DS) {
  const U = {};
  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
  U.dist = (ax, ay, bx, by) => Math.sqrt(U.dist2(ax, ay, bx, by));
  U.rand = (a, b) => a + Math.random() * (b - a);
  U.randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  U.choose = (arr) => arr[Math.floor(Math.random() * arr.length)];
  U.shuffle = (arr, rng) => { const r = rng || Math.random; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
  U.fmtTime = (s) => { s = Math.max(0, Math.floor(s)); const m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; };
  U.fmt = (n) => { n = Math.floor(n); if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B'; if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k'; return '' + n; };
  // deterministic RNG
  U.mulberry32 = function (a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  U.hashStr = function (s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  U.hash2 = function (x, y, s) { let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  U.todayKey = function () { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  U.angleDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
  U.esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  U.pct = (v) => (v > 0 ? '+' : '') + Math.round(v) + '%';
  DS.U = U;
  DS.debug = /[?&]debug/.test(location.search);
})(window.DS);

  // Desktop: fixed 1280x720 logical stage, letterboxed (unchanged).

  let scale = 1, bufK = 1;

  }
  function readSafe() {
    let pr = document.getElementById('safeProbe');
    if (!pr) { pr = document.createElement('div'); pr.id = 'safeProbe'; document.body.appendChild(pr); }
    const cs = getComputedStyle(pr); const f = (v) => parseFloat(v) || 0;
    return { t: f(cs.paddingTop), r: f(cs.paddingRight), b: f(cs.paddingBottom), l: f(cs.paddingLeft) };

  DS.applyFx = function () { const o = DS.save && DS.save.options; DS.lowFx = o && o.lowFx != null ? !!o.lowFx : !!DS.touchMode; resize(); };
  function setBodyClasses() {
    const b = document.body.classList;
    b.toggle('touch', !!DS.touchMode); b.toggle('compact', DS.VW < 1100); b.toggle('narrow', DS.VW < 800); b.toggle('short', DS.VH < 560); b.toggle('is-portrait', DS.VH > DS.VW);
    b.toggle('lefty', !!(DS.save && DS.save.options.leftHanded));
  }
  function resize() {
    const wrap = document.getElementById('wrap'); if (!wrap || !canvas) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    if (DS.touchMode) {
      const m = Math.min(vw, vh); scale = m / DS.U.clamp(m, 440, 720);
      DS.VW = Math.round(vw / scale); DS.VH = Math.round(vh / scale);
      wrap.style.left = '0px'; wrap.style.top = '0px'; wrap.style.transformOrigin = '0 0';
      wrap.style.transform = 'scale(' + scale + ')';
      const sp = readSafe(); DS.SAFE = { t: sp.t / scale, r: sp.r / scale, b: sp.b / scale, l: sp.l / scale };
      const dpr = window.devicePixelRatio || 1; bufK = Math.max(0.75, scale * Math.min(dpr, DS.lowFx ? 1.5 : 2));
    } else {
      scale = Math.min(vw / W, vh / H); DS.VW = W; DS.VH = H; DS.SAFE = { t: 0, r: 0, b: 0, l: 0 };
      wrap.style.left = '50%'; wrap.style.top = '50%'; wrap.style.transformOrigin = 'center center';
      wrap.style.transform = 'translate(-50%,-50%) scale(' + scale + ')'; bufK = 1;
    }
    DS.UI_SCALE = scale;
    DS.ZOOM = Math.min(1, Math.min(DS.VW, DS.VH) / 600); DS.WW = DS.VW / DS.ZOOM; DS.WH = DS.VH / DS.ZOOM;
    wrap.style.width = DS.VW + 'px'; wrap.style.height = DS.VH + 'px';
    canvas.style.width = DS.VW + 'px'; canvas.style.height = DS.VH + 'px';
    const bw = Math.round(DS.VW * bufK), bh = Math.round(DS.VH * bufK);
    if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
    ctx.imageSmoothingEnabled = false;
    const st = wrap.style; st.setProperty('--sat', DS.SAFE.t + 'px'); st.setProperty('--sar', DS.SAFE.r + 'px'); st.setProperty('--sab', DS.SAFE.b + 'px'); st.setProperty('--sal', DS.SAFE.l + 'px');
    setBodyClasses();
    if (DS.UI && DS.UI.onResize) DS.UI.onResize();
  }
  DS.relayout = resize;
  function toCanvas(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * DS.VW, y: (e.clientY - r.top) / r.height * DS.VH }; }

  // ---------- touch controls ----------
  function touchActive() { const g = DS.game; return DS.state === 'run' && g && !g.paused && !g.modal && !g.over; }
  function resetJoy() { Input.joyActive = false; Input.joyId = null; Input.joy.x = 0; Input.joy.y = 0; }
  function onTouchStart(e) {
    DS.Audio.unlock();
    if (!DS.touchMode) { DS.touchMode = true; DS.applyFx(); }
    if (!touchActive()) return;
    e.preventDefault();
    const L = DS.touchUI;
    for (const t of e.changedTouches) {
      const p = toCanvas(t);
      if (L && Math.hypot(p.x - L.pause.x, p.y - L.pause.y) < L.pause.r + 16) { resetJoy(); DS.UI.pause(); return; }
      if (L && Math.hypot(p.x - L.sp.x, p.y - L.sp.y) < L.sp.r + 18) { Input.mouseR = true; continue; }
      if (Input.joyActive) continue;
      const left = L ? L.left : false; const portrait = DS.VH > DS.VW;
      const inZone = portrait || (left ? p.x > DS.VW / 2 : p.x < DS.VW / 2);
      if (!inZone) { Input.mouseR = true; continue; } // tap on the far side also fires the special
      Input.joyActive = true; Input.joyId = t.identifier; Input.joyBase.x = p.x; Input.joyBase.y = p.y; Input.joy.x = 0; Input.joy.y = 0;
    }
  }
  function onTouchMove(e) {
    if (!touchActive()) return; e.preventDefault();
    const R = (DS.touchUI && DS.touchUI.joyR) || 60;
    for (const t of e.changedTouches) {
      if (t.identifier !== Input.joyId) continue;
      const p = toCanvas(t); let dx = p.x - Input.joyBase.x, dy = p.y - Input.joyBase.y; const l = Math.hypot(dx, dy);
      if (l > R) { Input.joyBase.x = p.x - dx / l * R; Input.joyBase.y = p.y - dy / l * R; dx = dx / l * R; dy = dy / l * R; } // base follows the thumb
      Input.joy.x = dx / R; Input.joy.y = dy / R;
    }
  }
  function onTouchEnd(e) {
    for (const t of e.changedTouches) if (t.identifier === Input.joyId) resetJoy();
    if (touchActive()) e.preventDefault();
  }

  function onKeyDown(e) {
    DS.Audio.init();
    if (DS.UI.captureKey && DS.UI.rebinding) { e.preventDefault(); DS.UI.captureKey(e.code); return; }
    if (e.code === 'F9') { e.preventDefault(); DS.debug = !DS.debug; if (DS.state === 'menu' && DS.UI.screen) { const s = DS.UI.screen; if (s === 'upgrade') DS.UI.upgrade(); else if (s === 'market') DS.UI.market(); else if (s === 'charselect') DS.UI.charSelect(); else if (s === 'menu') DS.UI.menu(); } return; }
    const g = DS.game; const keys = DS.save.options.keys;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].indexOf(e.code) >= 0 && e.target.tagName !== 'INPUT') e.preventDefault();
    if (!Input.keys.has(e.code)) Input.pressedSet.add(e.code);
    Input.keys.add(e.code);
    if (DS.state === 'run' && g) {
      if (g.modal) { const n = parseInt(e.key, 10); if (n >= 1 && n <= g.modal.offers.length) g.choose(n - 1); return; }
      if (e.code === keys.pause || e.code === 'Escape' || e.code === 'KeyP') { if (g.paused) { if (DS.UI.screen === 'options' && DS.UI.optReturn === 'pause') DS.UI.pause(); else DS.UI.resume(); } else DS.UI.pause(); return; }
      if (DS.debug && !g.paused) {
        if (e.code === 'KeyG') { DS.save.gold += 1000; DS.persist(); g.text(g.player.x, g.player.y - 60, '+1000 gold (bank)', '#ff60ff', 14); }
        if (e.code === 'KeyT') { g.time += 60; g.text(g.player.x, g.player.y - 60, 'TIME SKIP +60s', '#ff60ff', 14); }
        if (e.code === 'KeyL') g.gainXp(g.xpNeed() - g.xp + 0.01);
        if (e.code === 'KeyK') g.enemies.forEach(en => { if (!en.dead) g.hit(en, 1e9, { noCrit: true, quiet: true }); });
        if (e.code === 'KeyB') g.spawnBoss(DS.U.choose(Object.keys(DS.BOSSES)), {});
        if (e.code === 'KeyI') g.god = !g.god;
      }
    } else if (e.code === 'Escape' && DS.state === 'menu' && DS.UI.screen !== 'menu') {
      if (DS.UI.overlay.style.display === 'flex') { DS.UI.overlay.style.display = 'none'; DS.UI.overlay.innerHTML = ''; } else DS.UI.menu();
    }
  }
  function onKeyUp(e) { Input.keys.delete(e.code); }

  function frame(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    fpsAcc += dt; fpsN++; if (fpsAcc >= 1) { DS.fps = fpsN; fpsAcc = 0; fpsN = 0; }
    const g = DS.game;
    ctx.setTransform(bufK, 0, 0, bufK, 0, 0);
    try {
      if (DS.state === 'run' && g) {
        if (!touchActive() && Input.joyActive) resetJoy();
        g.mouse.x = Input.mouseX; g.mouse.y = Input.mouseY;
        g.update(dt, Input);
        DS.Render.drawGame(ctx, g);
      } else if (DS.state === 'results' && g) {
        DS.Render.drawGame(ctx, g); ctx.fillStyle = 'rgba(10,0,20,0.7)'; ctx.fillRect(0, 0, DS.VW, DS.VH);
      } else {
        DS.Render.drawMenuBg(ctx, ts / 1000);
      }
    } catch (err) { console.error(err); }
    Input.pressedSet.clear();
    requestAnimationFrame(frame);
  }

  function boot() {
    DS.loadSave();
    canvas = document.getElementById('game'); ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
    DS.Spr.buildChars(); DS.Spr.buildBosses(); DS.Spr.buildMonsters(0);
    DS.touchMode = detectTouch(); DS.lowFx = DS.save.options.lowFx != null ? !!DS.save.options.lowFx : DS.touchMode;
    resize();
    DS.UI.init(); DS.UI.menu();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 120));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => { if (document.hidden) { Input.keys.clear(); resetJoy(); if (DS.state === 'run' && DS.game && !DS.game.over && !DS.game.modal && !DS.game.paused) DS.UI.pause(); } });

    document.addEventListener('touchend', () => DS.Audio.unlock(), { passive: true });

    window.addEventListener('blur', () => { Input.keys.clear(); if (DS.state === 'run' && DS.game && !DS.game.over && !DS.game.modal) DS.UI.pause(); });

    document.addEventListener('mousemove', (e) => { if (!canvas) return; const p = toCanvas(e); Input.mouseX = p.x; Input.mouseY = p.y; });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('pointerdown', () => DS.Audio.unlock(), { once: false });

  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window.DS);

</script>
